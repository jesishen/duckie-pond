<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duck Pond</title>
<style>
html,body{height:100%;overflow:hidden;margin:0}
body{background:#2f7fa3 url("water.jpg") center / cover no-repeat fixed;-webkit-user-select:none;user-select:none}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;z-index:1;background:transparent}
#vol{position:fixed;top:calc(16px + env(safe-area-inset-top, 0px));right:16px;z-index:2;display:flex;align-items:center;gap:8px;opacity:.8;color:#fff}
#vol:hover,#vol:focus-within{opacity:1}
#mute{display:flex;padding:6px;margin:0;border:0;background:none;color:#fff;cursor:pointer;border-radius:6px}
#mute:focus-visible,#volume:focus-visible{outline:2px solid #fff;outline-offset:3px}
#mute svg{width:24px;height:24px;display:block}
#mute .x{display:none}
#mute.off .x{display:inline}
#mute.off .waves{display:none}
#volume{--p:80%;-webkit-appearance:none;appearance:none;width:110px;height:4px;margin:0;border-radius:2px;cursor:pointer;
  background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,.35) var(--p))}
#volume::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#volume::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#volume::-moz-range-track{background:transparent}
</style>
</head>
<body>

<canvas id="pond" aria-label="Pond with ducks. Move the pointer to nudge them, click or tap to drop kibble."></canvas>
<div id="vol">
  <button id="mute" type="button" aria-label="Mute">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <path class="waves" d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="x" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
</div>

<script>
(() => {
const cv = document.getElementById('pond');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');

let W = 0, H = 0, DPR = 1, S = 1;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ---------- overlay on the water image ---------- */
function paintBackground() {
  bg.width = W * DPR; bg.height = H * DPR;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.clearRect(0, 0, W, H); // the water image shows through
  // vignette
  const v = bctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  v.addColorStop(0, 'rgba(20,60,90,0)'); v.addColorStop(1, 'rgba(10,40,70,.25)');
  bctx.fillStyle = v; bctx.fillRect(0, 0, W, H);
}

/* ---------- ducks ---------- */
const ducks = [];
function makeDuck(adult) {
  const L = (adult ? 85 : 45) * S;
  return {
    adult, L, x: rnd(L * 2, W - L * 2), y: rnd(L * 2, H - L * 2), vx: 0, vy: 0,
    h: rnd(0, 6.28), wander: rnd(0, 6.28), rest: 0, bob: rnd(0, 6.28), eat: 0, wake: 0,
    pace: adult ? rnd(28, 40) : rnd(34, 50)
  };
}
function spawnDucks() {
  ducks.length = 0;
  for (let i = 0; i < 2; i++) ducks.push(makeDuck(true));
  for (let i = 0; i < 8; i++) {
    const d = makeDuck(false), m = ducks[i % 2];
    d.x = clamp(m.x + rnd(-80, 80) * S, d.L, W - d.L); d.y = clamp(m.y + rnd(-80, 80) * S, d.L, H - d.L);
    ducks.push(d);
  }
}
function rescaleDucks() {
  ducks.forEach(d => { d.L = (d.adult ? 85 : 45) * S; d.x = clamp(d.x, d.L, W - d.L); d.y = clamp(d.y, d.L, H - d.L); });
}

const sprites = {};
const canBlur = 'filter' in ctx;
function buildSprites() {
  for (const adult of [true, false]) {
    const L = (adult ? 85 : 45) * S, pad = L * .25;
    const w = L * 1.4 + pad * 2, h = L * 1.0 + pad * 2, ox = pad + L * .7, oy = h / 2;
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.translate(ox, oy);
    if (canBlur) g.filter = `blur(${(adult ? .4 : .3) * S}px)`;
    paintDuck(g, adult, L);
    sprites[adult ? 'a' : 'k'] = { c, w, h, ox, oy };
  }
}

// soft light from one side, cool shadow on the other
function shade(c, adult, x0, y0, x1, y1) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, 'rgba(255,255,255,.45)');
  g.addColorStop(.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, adult ? 'rgba(100,120,165,.65)' : 'rgba(195,100,20,.65)');
  c.fillStyle = g;
}

// short painterly strokes inside an ellipse
function brushStrokes(c, cx, cy, rx, ry, adult, n) {
  const cols = adult
    ? ['rgba(255,255,255,.45)', 'rgba(140,155,185,.28)', 'rgba(235,222,200,.35)']
    : ['rgba(255,248,190,.5)', 'rgba(215,135,35,.28)', 'rgba(255,215,110,.4)'];
  c.save();
  c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, 7); c.clip();
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), d = Math.sqrt(Math.random());
    const x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
    const len = rnd(.25, .5) * rx, ang = rnd(-.35, .35);
    c.strokeStyle = cols[i % cols.length]; c.lineWidth = rnd(1, 2.4) * S;
    c.beginPath(); c.moveTo(x - Math.cos(ang) * len / 2, y - Math.sin(ang) * len / 2);
    c.quadraticCurveTo(x, y + rnd(-1, 1) * len * .2, x + Math.cos(ang) * len / 2, y + Math.sin(ang) * len / 2);
    c.stroke();
  }
  c.restore();
}

// everything except the eyes and beak: painted once, slightly softened
function paintDuck(c, adult, L) {
  c.fillStyle = 'rgba(18,58,88,.28)';
  c.beginPath(); c.ellipse(L * .06, L * .12, L * .5, L * .33, 0, 0, 7); c.fill();
  c.strokeStyle = 'rgba(230,250,250,.35)'; c.lineWidth = 1.5 * S;
  c.beginPath(); c.ellipse(-L * .02, 0, L * .5, L * .35, 0, 0, 7); c.stroke();

  const outline = adult ? 'rgba(110,95,78,.7)' : 'rgba(170,110,30,.6)';
  const bodyG = c.createRadialGradient(-L * .05, -L * .08, L * .02, 0, 0, L * .45);
  if (adult) { bodyG.addColorStop(0, '#fffdf6'); bodyG.addColorStop(.7, '#f4efe3'); bodyG.addColorStop(1, '#d9d1c1'); }
  else { bodyG.addColorStop(0, '#fff2a8'); bodyG.addColorStop(.6, '#ffd84f'); bodyG.addColorStop(1, '#eab23a'); }
  c.lineWidth = (adult ? 1.6 : 1.3) * S; c.strokeStyle = outline; c.fillStyle = bodyG;

  c.beginPath();
  if (adult) { c.moveTo(-L * .34, -L * .12); c.quadraticCurveTo(-L * .62, 0, -L * .34, L * .12); }
  else { c.moveTo(-L * .28, -L * .1); c.quadraticCurveTo(-L * .46, 0, -L * .28, L * .1); }
  c.fill(); c.stroke();
  c.beginPath(); c.ellipse(-L * .02, 0, adult ? L * .42 : L * .34, adult ? L * .27 : L * .28, 0, 0, 7); c.fill(); c.stroke();
  shade(c, adult, -L * .3, -L * .3, L * .15, L * .3); c.fill();
  brushStrokes(c, -L * .02, 0, adult ? L * .42 : L * .34, adult ? L * .27 : L * .28, adult, 18);

  c.fillStyle = adult ? 'rgba(200,188,168,.55)' : 'rgba(230,160,40,.35)';
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(-L * .1, s * L * (adult ? .13 : .14), L * (adult ? .26 : .17), L * .09, s * .12, 0, 7); c.fill();
    if (adult) {
      c.strokeStyle = 'rgba(130,115,95,.45)'; c.lineWidth = 1 * S;
      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-L * (.3 - k * .06), s * L * .16); c.lineTo(-L * (.2 - k * .06), s * L * .11); c.stroke(); }
    }
  }

  const hx = L * (adult ? .3 : .24), hr = L * (adult ? .16 : .17);
  const headG = c.createRadialGradient(hx - hr * .3, -hr * .3, 0, hx, 0, hr);
  if (adult) { headG.addColorStop(0, '#ffffff'); headG.addColorStop(1, '#e6dfd0'); }
  else { headG.addColorStop(0, '#fff3b0'); headG.addColorStop(1, '#f6c740'); }
  c.fillStyle = headG; c.strokeStyle = outline; c.lineWidth = (adult ? 1.6 : 1.3) * S;
  c.beginPath(); c.arc(hx, 0, hr, 0, 7); c.fill(); c.stroke();
  shade(c, adult, hx - hr, -hr, hx + hr * .6, hr); c.fill();
  brushStrokes(c, hx, 0, hr, hr, adult, 6);
  if (!adult) {
    c.strokeStyle = 'rgba(200,140,30,.7)'; c.lineWidth = 1.2 * S;
    c.beginPath(); c.moveTo(hx - hr * .2, 0); c.quadraticCurveTo(hx - hr * .6, -hr * .2, hx - hr * .9, hr * .1); c.stroke();
    c.fillStyle = 'rgba(245,140,110,.35)';
    for (const s of [-1, 1]) { c.beginPath(); c.arc(hx, s * hr * .78, hr * .16, 0, 7); c.fill(); }
  }
}

function drawDuck(d, t) {
  const L = d.L, sp = sprites[d.adult ? 'a' : 'k'];
  const bob = 1 + Math.sin(t * 2.2 + d.bob) * .018;
  const dip = d.eat > 0 ? Math.sin(d.eat * 18) * .04 * L : 0;
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.hs ?? d.h); ctx.scale(bob, bob); ctx.translate(dip, 0);
  ctx.drawImage(sp.c, -sp.ox, -sp.oy, sp.w, sp.h);
  const hx = L * (d.adult ? .3 : .24), hr = L * (d.adult ? .16 : .17);
  // crisp beak
  const bl = d.adult ? 1.9 : 1.6;
  ctx.fillStyle = d.adult ? '#f29a3a' : '#f3a64a'; ctx.strokeStyle = 'rgba(160,80,20,.5)'; ctx.lineWidth = 1 * S;
  ctx.beginPath();
  ctx.moveTo(hx + hr * .7, -hr * .42);
  ctx.quadraticCurveTo(hx + hr * bl, -hr * .3, hx + hr * bl, 0);
  ctx.quadraticCurveTo(hx + hr * bl, hr * .3, hx + hr * .7, hr * .42);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // crisp eyes
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#2b2622'; ctx.beginPath(); ctx.arc(hx + hr * .25, s * hr * .62, hr * .16, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + hr * .3, s * hr * .62 - hr * .05, hr * .06, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- sounds ---------- */
const QUACK_VOL = .6, POND_VOL = .25;
const quack = new Audio('quack.mp3');
quack.preload = 'auto';
const pondSound = new Audio('pond.mp3');
pondSound.loop = true;
let master = .8, muted = false;

// browsers only allow sound after the first click/tap
let pondStarted = false;
function startPond() {
  if (pondStarted) return;
  pondStarted = true;
  pondSound.play().catch(() => { pondStarted = false; });
}
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
  addEventListener(ev, startPond, { passive: true }));

function feeding() { return kibble.some(k => k.state !== 'eaten'); }
// plays the quack once; never overlaps itself
function playQuack() {
  quack.volume = QUACK_VOL * master; // cancels any fade if new food is dropped
  if (!quack.paused) return;
  quack.currentTime = 0;
  quack.play().catch(() => {});
}
// when the quack finishes, play it again only if there's still food out
quack.addEventListener('ended', () => { if (feeding()) playQuack(); });
// runs every frame: once the food is gone, fade the quack out over 2 seconds
function fadeQuack(dt) {
  if (quack.paused || feeding() || !quack.duration) return;
  const left = quack.duration - quack.currentTime;          // seconds left in the clip
  const target = QUACK_VOL * master * clamp(left / 2, 0, 1); // fades over the final 2 seconds
  quack.volume = Math.min(quack.volume, target);
}

/* ---------- volume control ---------- */
const volEl = document.getElementById('volume');
const muteEl = document.getElementById('mute');
function applyVolume() {
  const silent = muted || master === 0;
  pondSound.volume = POND_VOL * master;
  if (quack.paused || feeding()) quack.volume = QUACK_VOL * master;
  pondSound.muted = quack.muted = silent;   // muting also works on iPhone
  muteEl.classList.toggle('off', silent);
  muteEl.setAttribute('aria-label', silent ? 'Unmute' : 'Mute');
  volEl.style.setProperty('--p', (silent ? 0 : master * 100) + '%');
}
volEl.addEventListener('input', () => { master = volEl.value / 100; muted = false; applyVolume(); });
muteEl.addEventListener('click', () => {
  if (master === 0) { master = .8; volEl.value = 80; muted = false; }
  else muted = !muted;
  applyVolume();
});
applyVolume();

/* ---------- ripples, kibble, splashes ---------- */
const ripples = [], kibble = [], drops = [];
function ripple(x, y, max, life, a = .5) { ripples.push({ x, y, r: 2, max, t: 0, life, a }); }

function dropFood(x, y) {
  playQuack();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    kibble.push({
      x: x + rnd(-16, 16) * S, y: y + rnd(-16, 16) * S, z: 1, t: -i * .06, state: 'falling',
      rot: rnd(0, 6.28), age: 0, size: rnd(4, 5.5) * S, hue: rnd(0, 1), vx: 0, vy: 0
    });
  }
}
function landKibble(k) {
  k.state = 'floating';
  ripple(k.x, k.y, 26 * S, .9, .6); ripple(k.x, k.y, 14 * S, .6, .5);
  for (let i = 0; i < 6; i++) {
    const a = rnd(0, 6.28), sp = rnd(30, 70) * S;
    drops.push({ x: k.x, y: k.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rnd(.25, .45) });
  }
}
function drawKibble(k) {
  const fall = k.state === 'falling' ? clamp(k.z, 0, 1) : 0;
  const sc = 1 + fall * 1.6, lift = fall * 70 * S;
  ctx.fillStyle = `rgba(20,55,80,${.15 + (1 - fall) * .2})`;
  ctx.beginPath(); ctx.ellipse(k.x + 2 * S, k.y + 2 * S, k.size * (1 + fall * .3), k.size * .8 * (1 + fall * .3), 0, 0, 7); ctx.fill();
  const alpha = k.state === 'floating' && k.age > 35 ? clamp(1 - (k.age - 35) / 5, 0, 1) : 1;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(k.x - lift * .35, k.y - lift); ctx.rotate(k.rot); ctx.scale(sc, sc);
  ctx.fillStyle = k.hue > .5 ? '#b77a43' : '#a5683a';
  ctx.strokeStyle = 'rgba(80,45,20,.7)'; ctx.lineWidth = .9 * S / sc;
  ctx.beginPath(); ctx.ellipse(0, 0, k.size, k.size * .78, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,225,180,.6)';
  ctx.beginPath(); ctx.arc(-k.size * .3, -k.size * .25, k.size * .3, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- pointer ---------- */
const ptr = { x: -999, y: -999, vx: 0, vy: 0, active: false, type: 'mouse', last: 0, down: null, rippleT: 0 };
cv.addEventListener('pointermove', e => {
  const now = performance.now(), dt = Math.max(8, now - ptr.last) / 1000;
  if (ptr.last && ptr.x > -900) { ptr.vx = (e.clientX - ptr.x) / dt; ptr.vy = (e.clientY - ptr.y) / dt; }
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.last = now; ptr.type = e.pointerType;
  ptr.active = e.pointerType === 'mouse' || e.buttons > 0 || ptr.down !== null;
});
cv.addEventListener('pointerdown', e => {
  ptr.down = { x: e.clientX, y: e.clientY, t: performance.now() };
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.last = performance.now(); ptr.type = e.pointerType; ptr.active = true;
  ptr.vx = ptr.vy = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointerup', e => {
  if (ptr.down) {
    const moved = Math.hypot(e.clientX - ptr.down.x, e.clientY - ptr.down.y);
    if (moved < 12 && performance.now() - ptr.down.t < 450) dropFood(e.clientX, e.clientY);
  }
  ptr.down = null;
  if (e.pointerType !== 'mouse') { ptr.active = false; ptr.vx = ptr.vy = 0; }
});
cv.addEventListener('pointercancel', () => { ptr.down = null; ptr.active = false; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { ptr.active = false; ptr.x = ptr.y = -999; } });

/* ---------- simulation ---------- */
function update(dt, t) {
  if (performance.now() - ptr.last > 90) { ptr.vx *= .8; ptr.vy *= .8; }
  const pSpeed = Math.hypot(ptr.vx, ptr.vy);
  if (ptr.active && pSpeed > 120) {
    ptr.rippleT -= dt;
    if (ptr.rippleT <= 0) { ripple(ptr.x, ptr.y, clamp(pSpeed * .05, 16, 50) * S, .9, .35); ptr.rippleT = .07; }
  }

  const floating = kibble.filter(k => k.state === 'floating');
  for (const d of ducks) {
    const L = d.L;
    let desired = d.wander, thrust = d.pace * S;

    // nearest kibble wins
    let best = null, bd = Infinity;
    for (const k of floating) { const dd = Math.hypot(k.x - d.x, k.y - d.y); if (dd < bd) { bd = dd; best = k; } }
    if (best) {
      desired = Math.atan2(best.y - d.y, best.x - d.x);
      thrust = (d.adult ? 190 : 220) * S * clamp(bd / (L * 1.2), .35, 1);
      d.rest = 0; d.mood = 1; d.moodTo = 1; d.moodT = 0;
    } else {
      d.wander += rnd(-1, 1) * dt * 1.2;
      if (!d.adult) {
        let m = ducks[0], md = Infinity;
        for (const a of ducks) if (a.adult) { const q = Math.hypot(a.x - d.x, a.y - d.y); if (q < md) { md = q; m = a; } }
        if (md > 120 * S) { const to = Math.atan2(m.y - d.y, m.x - d.x); d.wander += angDiff(d.wander, to) * dt * .9; }
      }
      const edge = L * 2.2;
      if (d.x < edge || d.x > W - edge || d.y < edge || d.y > H - edge) {
        const to = Math.atan2(H / 2 - d.y, W / 2 - d.x); d.wander += angDiff(d.wander, to) * dt * 2;
      }
      desired = d.wander;
      // mood: now and then one duck speeds up for a bit, or dawdles
      if (d.moodT > 0) d.moodT -= dt;
      else if (Math.random() < dt * .02) { d.moodT = rnd(3.5, 7); d.moodTo = Math.random() < .6 ? rnd(3.5, 5.5) : rnd(.35, .6); }
      else d.moodTo = 1;
      d.mood = (d.mood ?? 1) + ((d.moodTo ?? 1) - (d.mood ?? 1)) * Math.min(1, dt * 1.5);
      thrust *= d.mood;
      if (d.mood > 1.3) d.rest = 0;
      if (d.rest > 0) { d.rest -= dt; thrust = 0; }
      else if (Math.random() < dt * .08) d.rest = rnd(1.5, 4);
    }

    const maxTurn = (best ? 5 : 1.6) * dt;
    d.h += clamp(angDiff(d.h, desired), -maxTurn, maxTurn);
    const facing = Math.abs(angDiff(d.h, desired)) < 1.2 ? 1 : .3;
    d.vx += Math.cos(d.h) * thrust * facing * dt * 1.6;
    d.vy += Math.sin(d.h) * thrust * facing * dt * 1.6;

    // pointer push
    if (ptr.active && ptr.x > -900) {
      const dx = d.x - ptr.x, dy = d.y - ptr.y, dist = Math.hypot(dx, dy) || 1;
      const R = (ptr.type === 'mouse' ? 95 : 120) * S + L * .4;
      if (dist < R) {
        const f = Math.pow(1 - dist / R, 1.6);
        const shove = (18 + Math.min(pSpeed, 700) * .22) * S * (d.adult ? .8 : 1.1);
        const carry = Math.min(1, 500 / (pSpeed || 1));
        d.vx += (dx / dist) * shove * f * dt * 4 + ptr.vx * carry * f * dt * .6;
        d.vy += (dy / dist) * shove * f * dt * 4 + ptr.vy * carry * f * dt * .6;
        d.rest = 0;
      }
    }

    // water drag
    const drag = Math.exp(-dt * 2.6);
    d.vx *= drag; d.vy *= drag;
    const sp = Math.hypot(d.vx, d.vy), cap = 260 * S;
    if (sp > cap) { d.vx *= cap / sp; d.vy *= cap / sp; }
    d.x += d.vx * dt; d.y += d.vy * dt;

    // body swings toward travel direction when shoved
    if (sp > 60 * S && !best) {
      const va = Math.atan2(d.vy, d.vx), turn = 1.2 * dt;
      d.h += clamp(angDiff(d.h, va) * dt * sp / (220 * S), -turn, turn);
      d.wander += angDiff(d.wander, d.h) * dt * 1.5;
    }

    // walls
    const m = L * .55, cush = L * 1.1, k = 900 * S;
    if (d.x < cush) d.vx += (cush - d.x) / cush * k * dt * .4;
    if (d.x > W - cush) d.vx -= (d.x - (W - cush)) / cush * k * dt * .4;
    if (d.y < cush) d.vy += (cush - d.y) / cush * k * dt * .4;
    if (d.y > H - cush) d.vy -= (d.y - (H - cush)) / cush * k * dt * .4;
    if (d.x < m) { d.x = m; d.vx = Math.abs(d.vx) * .3; }
    if (d.x > W - m) { d.x = W - m; d.vx = -Math.abs(d.vx) * .3; }
    if (d.y < m) { d.y = m; d.vy = Math.abs(d.vy) * .3; }
    if (d.y > H - m) { d.y = H - m; d.vy = -Math.abs(d.vy) * .3; }

    // smoothed heading for drawing
    d.hs = (d.hs ?? d.h) + angDiff(d.hs ?? d.h, d.h) * Math.min(1, dt * 6);

    // wake
    d.wake -= dt;
    if (sp > 25 * S && d.wake <= 0) {
      ripple(d.x - Math.cos(d.h) * L * .4, d.y - Math.sin(d.h) * L * .4, L * .55, 1.2, .28);
      d.wake = clamp(.6 - sp / (400 * S), .12, .6);
    }

    // eat
    if (d.eat > 0) d.eat -= dt;
    if (best) {
      const hx = d.x + Math.cos(d.h) * L * (d.adult ? .42 : .38), hy = d.y + Math.sin(d.h) * L * (d.adult ? .42 : .38);
      if (Math.hypot(best.x - hx, best.y - hy) < L * (d.adult ? .22 : .26)) {
        best.state = 'eaten'; d.eat = .45;
        ripple(best.x, best.y, 18 * S, .6, .5);
        const i = floating.indexOf(best); if (i >= 0) floating.splice(i, 1);
      }
    }
  }

  // ducks gently keep their distance (soft spring, no snapping)
  for (let i = 0; i < ducks.length; i++) for (let j = i + 1; j < ducks.length; j++) {
    const a = ducks[i], b = ducks[j], dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || .01;
    const comfy = (a.L + b.L) * .65, min = (a.L + b.L) * .42;
    if (dist < comfy) {
      const nx = dx / dist, ny = dy / dist;
      const f = (1 - dist / comfy) ** 1.5 * 900 * S * dt;
      const wa = b.L / (a.L + b.L), wb = a.L / (a.L + b.L);
      a.vx -= nx * f * wa; a.vy -= ny * f * wa; b.vx += nx * f * wb; b.vy += ny * f * wb;
      if (dist < min) {
        const push = (min - dist) * .3;
        a.x -= nx * push * wa; a.y -= ny * push * wa; b.x += nx * push * wb; b.y += ny * push * wb;
      }
    }
  }

  // kibble
  for (let i = kibble.length - 1; i >= 0; i--) {
    const k = kibble[i];
    if (k.state === 'eaten') { kibble.splice(i, 1); continue; }
    if (k.state === 'falling') {
      k.t += dt;
      if (k.t > 0) { const p = k.t / .55; k.z = 1 - p * p; k.rot += dt * 6; if (k.z <= 0) { k.z = 0; landKibble(k); } }
    } else {
      k.age += dt;
      k.x += Math.sin(t * .6 + k.rot) * dt * 2 * S; k.y += Math.cos(t * .5 + k.rot) * dt * 2 * S;
      for (const d of ducks) { const dx = k.x - d.x, dy = k.y - d.y, q = Math.hypot(dx, dy); if (q < d.L * .35 && q > 0) { k.x += dx / q * dt * 20; k.y += dy / q * dt * 20; } }
      k.x = clamp(k.x, 8, W - 8); k.y = clamp(k.y, 8, H - 8);
      if (k.age > 40) kibble.splice(i, 1);
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.t += dt; if (r.t > r.life) ripples.splice(i, 1); }
  for (let i = drops.length - 1; i >= 0; i--) { const p = drops[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) drops.splice(i, 1); }
}

/* ---------- render ---------- */
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.lineCap = 'round';
  for (const r of ripples) {
    const p = r.t / r.life, rad = r.r + (r.max - r.r) * (1 - (1 - p) * (1 - p));
    ctx.strokeStyle = `rgba(240,252,250,${r.a * (1 - p)})`; ctx.lineWidth = 2 * S * (1 - p * .5);
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * .92, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = `rgba(30,90,120,${r.a * .4 * (1 - p)})`; ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.ellipse(r.x + 1.5 * S, r.y + 2 * S, rad, rad * .92, 0, 0, 7); ctx.stroke();
  }
  kibble.forEach(k => { if (k.state === 'floating') drawKibble(k); });
  [...ducks].sort((a, b) => a.L - b.L).forEach(d => drawDuck(d, t));
  kibble.forEach(k => { if (k.state === 'falling' && k.t > 0) drawKibble(k); });
  for (const p of drops) {
    ctx.fillStyle = `rgba(245,255,255,${.8 * (1 - p.t / p.life)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2 * S, 0, 7); ctx.fill();
  }
  if (ptr.active && ptr.x > -900) {
    ctx.strokeStyle = 'rgba(255,253,240,.55)'; ctx.lineWidth = 1.5 * S;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 14 * S, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,253,240,.18)'; ctx.fill();
  }
}

/* ---------- loop & sizing ---------- */
function resize() {
  const first = W === 0;
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  S = clamp(Math.min(W, H) / 760, .7, 1.25);
  cv.width = W * DPR; cv.height = H * DPR;
  paintBackground();
  buildSprites();
  if (first) spawnDucks(); else rescaleDucks();
}
addEventListener('resize', resize);
resize();

dropFood(W * .55, H * .55);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.04, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  update(dt, t); fadeQuack(dt); render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
